name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  commit-count:
    name: Commit count check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fail if more than one commit
        run: |
          git fetch origin main
          COMMITS=$(git rev-list --count origin/main..HEAD)
          echo "Commits on branch: $COMMITS"
          if [ "$COMMITS" -gt 1 ]; then
            echo "Please squash your commits into one before opening a PR."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/pb/Dockerfile
          ignore: DL3018

      - name: Lint entrypoint.sh
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./docker/pb

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pb/Dockerfile
          push: false
